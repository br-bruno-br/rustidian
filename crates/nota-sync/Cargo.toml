[package]
name = "nota-sync"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Motor de reconciliacao, diario e cliente de sincronizacao de notas (cofre cifrado ponta a ponta)"
license = "MIT"
publish = false

[dependencies]
nota-cripto = { path = "../nota-cripto" }
blake3 = "1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
redb = "=4.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Cliente HTTP: so HTTP puro (sem TLS, sem OpenSSL). Ver "Desvios da R4" no PLANO.
ureq = { version = "3", default-features = false }

[dev-dependencies]
proptest = "1"
tempfile = "3.27"
