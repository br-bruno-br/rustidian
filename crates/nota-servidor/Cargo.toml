[package]
name = "nota-servidor"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Servidor de sincronizacao de notas: guarda so blobs cifrados e o indice (axum + SQLite)"
license = "MIT"
publish = false

[dependencies]
nota-sync = { path = "../nota-sync" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query", "matched-path"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "signal"] }

[dev-dependencies]
nota-cripto = { path = "../nota-cripto" }
tempfile = "3.27"
ureq = { version = "3", default-features = false }
