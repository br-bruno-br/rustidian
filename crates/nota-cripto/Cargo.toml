[package]
name = "nota-cripto"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Chave do cofre e cifra de arquivos e nomes (XChaCha20-Poly1305, Argon2id, HKDF)"
license = "MIT"
publish = false

[dependencies]
argon2 = "0.5"
chacha20poly1305 = "0.10"
hkdf = "0.12"
hmac = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
unicode-normalization = "0.1"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
proptest = "1"
