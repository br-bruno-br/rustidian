plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.rustidian.protoegui'
    compileSdk 36

    defaultConfig {
        applicationId 'dev.rustidian.protoegui'
        minSdk 26
        // 34 (e não 35+): a partir do 35 o Android força tela de ponta a ponta e ignora o
        // adjustResize, o que faria o teclado cobrir o texto.
        targetSdk 34
        versionCode 2
        versionName '0.2.0'
        ndk { abiFilters 'arm64-v8a' }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Chave de DEBUG de propósito: é um protótipo para instalar à mão.
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packagingOptions {
        jniLibs { useLegacyPackaging = true }
    }
}

dependencies {
    // Alinha as versões do Kotlin (o appcompat e o games-activity puxam versões diferentes).
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.games:games-activity:4.4.0'
}
