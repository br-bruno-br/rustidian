# Protótipo R7a: egui (eframe 0.37 + GameActivity) no Android. NÃO faz parte do workspace do app:
# o `[workspace]` vazio abaixo (e o `exclude` no Cargo.toml da raiz) isolam este build.
[package]
name = "rustidian-proto-egui"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
description = "Protótipo: TextEdit do egui com o Gboard no Android"

[workspace]

[lib]
name = "rustidian_proto_egui"
crate-type = ["cdylib", "rlib"]

[dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "glow", "android-game-activity"] }
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
# Mesma versão que o winit puxa (0.6.1); precisamos dela direto para ler o estado do IME.
android-activity = { version = "=0.6.1", features = ["game-activity"] }
android_logger = "0.15"

[profile.release]
opt-level = "s"
strip = true
panic = "abort"
codegen-units = 16
