[package]
name = "rustidian"
version = "0.1.6"
edition = "2024"
rust-version = "1.95"
description = "Rustidian — a native Markdown notebook for local vaults"
repository = "https://github.com/MasihMoafi/rustidian"
readme = "README.md"
keywords = ["markdown", "notes", "obsidian", "egui"]
categories = ["text-editors"]
license = "MIT"

[workspace]
members = [".", "crates/*"]
default-members = ["."]
resolver = "3"

[features]
default = ["desktop"]
desktop = []
# Aba do agente (terminal com Codex/Claude/Elpis dentro do cofre). Desligada por padrão no fork:
# manda trechos da nota a um CLI externo (revisão de segurança de 15/11/2026). Só Linux por enquanto.
agente = ["dep:portable-pty", "dep:vt100"]

[[bin]]
name = "rustidian"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "clipboard", "links"] }
epaint = { version = "0.37", default-features = false, features = ["color_fonts"] }
egui_commonmark = { version = "0.26", default-features = false, features = ["pulldown_cmark"] }
egui_extras = { version = "0.37", default-features = false, features = ["svg", "file", "image", "gif", "webp", "http"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
walkdir = "2.5"
pulldown-cmark = { version = "0.13.4", default-features = false }
ratex-parser = { version = "=0.1.15", default-features = false }
ratex-layout = { version = "=0.1.15", default-features = false }
ratex-types = "=0.1.15"
ratex-svg = { version = "=0.1.15", default-features = false, features = ["embed-fonts"] }
notify = "8.2"
nucleo-matcher = "0.3"
trash = "5.2"
base64 = "0.22"
percent-encoding = "2.3"
serde_yaml_ng = "0.10"
serde-saphyr = { version = "2.0", default-features = false, features = ["deserialize"] }
regex = "1.12"
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "regex-fancy"] }
two-face = { version = "=0.5.1", default-features = false, features = ["syntect-fancy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27"
mermaid-rs-renderer = { version = "=0.3.1", default-features = false }
usvg = { version = "=0.45.1", default-features = false, features = ["text"] }
redb = "=4.4.0"
imara-diff = { version = "=0.2.0", default-features = false }
fastrand = "=2.5.0"
portable-pty = { version = "0.9", optional = true }
vt100 = { version = "0.16", optional = true }
htmd = "=0.5.6"
# Sync of the open vault (R5): the vault key, the engine and the system credential store.
nota-cripto = { path = "crates/nota-cripto" }
nota-sync = { path = "crates/nota-sync" }
keyring = { version = "4.2", default-features = false, features = ["v1"] }

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.15", default-features = false }
# MoveFileExW: a rename that never replaces the destination (src/operations.rs). Already in the
# lock through rfd and glutin; no new crate.
windows-sys = { version = "0.59", default-features = false, features = ["Win32_Storage_FileSystem"] }

# Signals, poll and the no-replace rename are Unix code (src/window.rs, src/operations.rs).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["event", "fs", "process"] }

# A launch's activation token raises the running window (src/window.rs).
[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = { version = "0.6", features = ["std"] }
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
egui-winit = { version = "0.37", default-features = false }

[dev-dependencies]
# A real server on a local port for the sync tests.
nota-servidor = { path = "crates/nota-servidor" }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[patch.crates-io]
epaint = { path = "vendor/epaint" }
egui = { path = "vendor/egui" }
