[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Tarefas de empacotamento, benchmark e release do Rustidian (substituem os scripts Python)"
license = "MIT"
publish = false

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
flate2 = "1"
regex = "1.12"
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
sha2 = "0.10"
ed25519-dalek = { version = "2.2", default-features = false, features = ["std"] }
getrandom = "0.3"
tar = { version = "0.4", default-features = false }
tempfile = "3.27"
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std"] }
walkdir = "2.5"
